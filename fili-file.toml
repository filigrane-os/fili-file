# fili-file (Casier) settings: every editable parameter, with its default value.
#
# This file is optional. To use it:
#   mkdir -p ~/.config/filigrane
#   cp fili-file.toml ~/.config/filigrane/fili-file.toml
# then uncomment (remove the leading "# " of) only the lines you want to change.
# A key you leave out keeps its default. Settings are read when a window opens.
#
# State changed by hand in the application (view, column widths) is kept in
# ~/.local/state/filigrane/ and takes precedence over this file.

# ---------------------------------------------------------------------------
# General settings. Flat `key = value` lines: keep them above any [section].
# ---------------------------------------------------------------------------

# Folder view: "list" or "grid".
# view = "list"

# Show hidden files (names starting with a dot): true or false.
# show_hidden = false

# Sort key: name, size, date (modified), kind, created, permissions, owner.
# sort = "date"

# Sort order: true = descending (most recent / largest first), false = ascending.
# sort_desc = true

# Close and Window buttons at the right of the toolbar: true or false.
# window_buttons = true

# Resident mode: keep a hidden copy of Casier loaded in the background, so that the window appears in about 0.15 s
# instead of 0.4 s. It costs about 35 MB of private memory while it is on (the libraries are shared with other Qt
# programs); a new copy loads after each opening. false: nothing runs while Casier is closed.
# Filigrane's Settings > Casier > Open instantly takes precedence over this line.
# resident = false

# Columns of the list view, comma separated (for example "size,modified").
# columns = "size,modified"

# Folder opened when started without an argument ("~" is the home folder).
# start = "~/Documents"

# Freedesktop icon theme. Default: the desktop's icon theme, else Adwaita.
# icon_theme = "Papirus"

# Icon name used for every folder. Default: the theme's own, else "folder".
# folder_icon = "folder"

# Icon name used for every regular file. Default: chosen by file type.
# file_icon = ""

# ---------------------------------------------------------------------------
# Theme. Each key may be set in [theme] (both modes) or in a mode section
# ([theme.dark], [theme.light]); a mode section wins for that mode only.
# Lookup order: this file > ~/.config/filigrane/theme.toml (all Filigrane
# applications) > built-in defaults (theme.toml in the source tree).
# Colors: "#rgb", "#rrggbb" or "#aarrggbb". Sizes and spacings: integers (px).
# An invalid value is ignored.
# ---------------------------------------------------------------------------

# [theme]
# Fonts
# font = "Jost"
# mono = "JetBrains Mono"
# icons = "Fili Icons"
# Type scale (px)
# size = 14
# size_list = 13
# size_small = 12
# size_label = 11
# size_title = 18
# Weight of emphasized text (400 regular, 600 semibold, 700 bold)
# weight_accent = 600
# Corner radii (px): marks and gauges, controls and rows, windows
# radius_mark = 2
# radius_control = 6
# radius_window = 10
# Border width (px)
# border_width = 1
# Spacing scale (px)
# space_1 = 4
# space_2 = 8
# space_3 = 12
# space_4 = 16
# space_5 = 20
# space_6 = 24
# Layout (px)
# row_height = 24
# side_row_height = 28
# icon_size = 16
# margin = 24
# toolbar_height = 44
# status_height = 28
# sidebar_width = 200
# tab_bar_height = 40
# tab_height = 28

# Dark mode colors (defaults shown)
# [theme.dark]
# background = "#1c222b"        # window background
# background_deep = "#181d25"   # recessed areas (preview, results)
# surface = "#232b36"           # fields, panels, menus
# surface_hover = "#2d3744"     # hovered row or button, selected sidebar item
# surface_active = "#3c4858"    # pressed button, text selection
# border = "#3c4858"            # outlines of fields, menus, cards
# muted = "#5f7894"             # secondary glyphs and disabled text
# text_secondary = "#a9b8c8"    # secondary text
# text = "#dbe7f4"              # main text
# warning = "#d2bf92"
# danger = "#c98f93"
# success = "#a3bfa8"
# accent = "#9dbbd6"            # fixed accent; unset = follows `fili-theme accent`
# accent_bright = "#b9d0e4"

# Light mode colors (defaults shown)
# [theme.light]
# background = "#f3f1ec"
# background_deep = "#f8f7f3"
# surface = "#e9e6df"
# surface_hover = "#dfdbd2"
# surface_active = "#cdc8bd"
# border = "#cdc8bd"
# muted = "#5f7894"
# text_secondary = "#4f5e70"
# text = "#1c222b"
# warning = "#80662b"
# danger = "#9a4f55"
# success = "#4a7354"
# accent = "#3f5a78"
# accent_bright = "#2f4a66"
