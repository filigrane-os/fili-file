[package]
name = "fili-file"
version = "1.19.0"
edition = "2024"
description = "Casier (fili-file): a fast file manager for Wayland desktops, written in Rust with a Qt Quick interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/filigrane-os/fili-file"
readme = "README.md"
keywords = ["file-manager", "wayland", "qt"]
categories = ["gui"]

[dependencies]
fili-ui = { git = "https://github.com/filigrane-os/fili-ui", tag = "v0.6.0" }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
env_logger = { version = "0.11", default-features = false }
libc = "0.2.191"
log = "0.4"
serde_json = "1"
zbus = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `make dev`: no link-time optimisation, several code generation units and incremental compilation, so that a change of the
# application rebuilds in a fraction of the release time
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
debug = 0

[build-dependencies]
cxx-qt-build = "0.10.0"
